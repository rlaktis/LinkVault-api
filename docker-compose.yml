services:
  postgres:
    image: postgres:16-alpine
    container_name: linkvault-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: linkvault_db
      POSTGRES_USER: linkvault_user
      POSTGRES_PASSWORD: linkvault_secret_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linkvault_user -d linkvault_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
